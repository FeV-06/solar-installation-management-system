<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="inverterChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="inverterScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="dcdbBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="340" fill="url(#wallGrad)"/>
  
  <!-- Subtle Wall Texture / Shadow -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Conduits (Pipes) From Roof to Inverter & DCDB -->
  <rect x="180" y="0" width="16" height="110" fill="url(#conduitGrad)" rx="2"/>
  <rect x="220" y="0" width="16" height="110" fill="url(#conduitGrad)" rx="2"/>
  <rect x="420" y="230" width="18" height="110" fill="url(#conduitGrad)" rx="2"/>

  <!-- DC Disconnect / DCDB Box (Left) -->
  <g transform="translate(150, 110)">
    <rect width="110" height="150" rx="6" fill="url(#dcdbBox)" stroke="#64748b" stroke-width="2"/>
    <text x="55" y="24" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">DCDB UNIT</text>
    <line x1="15" y1="32" x2="95" y2="32" stroke="#64748b" stroke-width="1"/>
    
    <!-- Rotary DC Isolator Switch -->
    <circle cx="55" cy="75" r="24" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="51" y="55" width="8" height="40" rx="3" fill="#dc2626"/>
    <text x="55" y="112" fill="#e2e8f0" font-size="8" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif">ON / ISOLATED</text>

    <!-- Surge Protection Devices (SPDs) -->
    <rect x="20" y="122" width="20" height="18" rx="2" fill="#16a34a"/>
    <rect x="45" y="122" width="20" height="18" rx="2" fill="#16a34a"/>
    <rect x="70" y="122" width="20" height="18" rx="2" fill="#16a34a"/>
  </g>

  <!-- Flexible Conduit Bridge between DCDB and Inverter -->
  <path d="M 260 185 C 285 185, 290 185, 310 185" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Solar String Inverter (Center / Right) -->
  <g transform="translate(310, 60)">
    <!-- Chassis Shadow & Body -->
    <rect x="4" y="4" width="200" height="210" rx="12" fill="#020617" opacity="0.4"/>
    <rect width="200" height="210" rx="10" fill="url(#inverterChassis)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Inverter Brand Header -->
    <text x="25" y="32" fill="#0f172a" font-size="15" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="1">SOL<tspan fill="#eab308">.</tspan>POWER</text>
    <text x="25" y="46" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">STRING INVERTER 5.0G</text>

    <!-- Heat Sink Vent Lines (Right Side) -->
    <line x1="165" y1="20" x2="185" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <line x1="165" y1="26" x2="185" y2="26" stroke="#94a3b8" stroke-width="2"/>
    <line x1="165" y1="32" x2="185" y2="32" stroke="#94a3b8" stroke-width="2"/>

    <!-- Backlit Digital LCD Display Screen -->
    <rect x="25" y="60" width="150" height="70" rx="5" fill="url(#inverterScreen)" stroke="#052e16" stroke-width="2"/>
    <text x="35" y="82" fill="#4ade80" font-size="16" font-weight="700" font-family="monospace">3.10 kW</text>
    <text x="110" y="82" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">GRID SYNC</text>
    
    <text x="35" y="104" fill="#a7f3d0" font-size="9.5" font-family="monospace">V_AC: 238.4 V &bull; 50 Hz</text>
    <text x="35" y="118" fill="#a7f3d0" font-size="9.5" font-family="monospace">P_DAY: 14.8 kWh</text>

    <!-- Status LEDs -->
    <g transform="translate(25, 148)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="18" y="11" fill="#334155" font-size="8.5" font-weight="600" font-family="system-ui, sans-serif">POWER</text>

      <circle cx="68" cy="8" r="5" fill="#22c55e"/>
      <text x="78" y="11" fill="#334155" font-size="8.5" font-weight="600" font-family="system-ui, sans-serif">GRID</text>

      <circle cx="120" cy="8" r="5" fill="#64748b"/>
      <text x="130" y="11" fill="#64748b" font-size="8.5" font-weight="600" font-family="system-ui, sans-serif">FAULT</text>
    </g>

    <!-- Caution Label -->
    <rect x="25" y="172" width="150" height="22" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="100" y="186" fill="#854d0e" font-size="8" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">⚡ CAUTION: DUAL POWER SOURCES</text>
  </g>

  <!-- Green Earth Grounding Wire running down -->
  <path d="M 205 260 L 205 340" stroke="#16a34a" stroke-width="5" stroke-dasharray="8 4"/>
  <text x="215" y="315" fill="#4ade80" font-size="8.5" font-weight="600" font-family="system-ui, sans-serif">COPPER EARTHING &lt; 2Ω</text>

  <!-- Verification Stamp Badge -->
  <g transform="translate(20, 20)">
    <rect width="190" height="34" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="7" fill="#16a34a"/>
    <path d="M14 17 L17 20 L22 14" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="32" y="16" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">INVERTER &amp; DCDB</text>
    <text x="32" y="27" fill="#94a3b8" font-size="8.5" font-family="system-ui, sans-serif">Wiring &amp; Isolation Tested</text>
  </g>
</svg>