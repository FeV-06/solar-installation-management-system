<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="meterBackplate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="meterChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lcdScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="earthPitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Background Utility Board -->
  <rect width="600" height="340" fill="#0f172a"/>
  
  <!-- Wooden/FRP Meter Backing Board -->
  <rect x="60" y="30" width="280" height="280" rx="8" fill="url(#meterBackplate)" stroke="#475569" stroke-width="2"/>

  <!-- Earth Pit Section on Right -->
  <g transform="translate(370, 40)">
    <rect width="190" height="260" rx="8" fill="url(#earthPitGrad)" stroke="#78350f" stroke-width="2"/>
    <text x="95" y="28" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CHEMICAL EARTH PIT</text>
    
    <!-- Chamber Inspection Cover -->
    <circle cx="95" cy="110" r="55" fill="#292524" stroke="#d97706" stroke-width="3"/>
    <circle cx="95" cy="110" r="45" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
    
    <!-- Heavy Pure Copper Busbar & Ground Rod -->
    <rect x="91" y="70" width="8" height="150" fill="#f97316" rx="2"/>
    <circle cx="95" cy="110" r="10" fill="#b45309" stroke="#fef08a" stroke-width="2"/>
    
    <!-- Earth Resistance Measurement -->
    <rect x="25" y="195" width="140" height="42" rx="4" fill="#0c0a09" stroke="#16a34a" stroke-width="1.5"/>
    <text x="95" y="214" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">1.42 Ω PASS</text>
    <text x="95" y="228" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">DISCOM Standard &lt; 2.0 Ω</text>
  </g>

  <!-- Grounding Cable Connecting Backboard to Pit -->
  <path d="M 280 270 C 320 270, 340 180, 461 180" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Net Meter Chassis -->
  <g transform="translate(100, 60)">
    <rect x="4" y="4" width="200" height="220" rx="16" fill="#020617" opacity="0.5"/>
    <rect width="200" height="220" rx="14" fill="url(#meterChassis)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Discom Logo & Title -->
    <text x="100" y="28" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">BI-DIRECTIONAL NET METER</text>
    <text x="100" y="40" fill="#64748b" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">3-PHASE 4-WIRE &bull; 240V / 415V</text>

    <!-- Digital Backlit LCD Display -->
    <rect x="20" y="52" width="160" height="60" rx="4" fill="url(#lcdScreen)" stroke="#065f46" stroke-width="1.5"/>
    
    <!-- Solar Export Arrow & Reading -->
    <text x="30" y="72" fill="#065f46" font-size="9" font-weight="700" font-family="system-ui, sans-serif">IMPORT ⇄ EXPORT (SOLAR)</text>
    <text x="30" y="96" fill="#064e3b" font-size="18" font-weight="800" font-family="monospace">00342.8</text>
    <text x="145" y="96" fill="#065f46" font-size="12" font-weight="700" font-family="sans-serif">kWh</text>

    <!-- Optical Calibration Port & LEDs -->
    <circle cx="100" cy="132" r="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="100" cy="132" r="5" fill="#dc2626"/>

    <g transform="translate(30, 155)">
      <circle cx="10" cy="5" r="4" fill="#22c55e"/>
      <text x="20" y="8" fill="#334155" font-size="8" font-weight="600" font-family="system-ui, sans-serif">PHASE</text>

      <circle cx="65" cy="5" r="4" fill="#eab308"/>
      <text x="75" y="8" fill="#334155" font-size="8" font-weight="600" font-family="system-ui, sans-serif">IMP/EXP</text>

      <circle cx="115" cy="5" r="4" fill="#22c55e"/>
      <text x="125" y="8" fill="#334155" font-size="8" font-weight="600" font-family="system-ui, sans-serif">EARTH</text>
    </g>

    <!-- Official Discom Hologram / Yellow Seal -->
    <rect x="70" y="180" width="60" height="25" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="100" y="196" fill="#854d0e" font-size="8" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">SEALED #9842</text>
  </g>

  <!-- Verification Stamp Badge -->
  <g transform="translate(20, 20)">
    <rect width="180" height="34" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="7" fill="#16a34a"/>
    <path d="M14 17 L17 20 L22 14" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="32" y="16" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">NET METER &amp; EARTH</text>
    <text x="32" y="27" fill="#94a3b8" font-size="8.5" font-family="system-ui, sans-serif">DISCOM Inspection Approved</text>
  </g>
</svg>